name: minimum-R
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum-R:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true
          extra-repositories: https://cttir.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # R 4.3.0 bundles Matrix 1.5-4 (ABI 0); current lme4 binaries need
          # ABI 1. Matrix 1.6-5 is the last release that supports R < 4.4.
          # Its Enhances include Bioconductor's graph, whose R 4.3 mirror is
          # gone; nothing here needs it.
          extra-packages: any::rcmdcheck, Matrix@1.6-5, graph=?ignore
          needs: check
      - name: Check declared minimum R
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(args = c("--as-cran", "--no-manual"),
                              error_on = "warning", check_dir = "check")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-R-results
          path: check
